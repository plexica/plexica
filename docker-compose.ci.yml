# CI-only overlay. `!override` prevents fixed local bindings from leaking into CI.
include:
  - path: ./infra/compose/docker-compose.ci-runtime-services.yml
    project_directory: .

services:
  postgres:
    ports: !override ['127.0.0.1::5432']
  keycloak:
    environment:
      KC_HTTP_ENABLED: 'true'
      KC_HOSTNAME_STRICT: 'false'
    ports: !override ['127.0.0.1::8080']
  keycloak-init:
    env_file:
      # Origins are discovered late in the lifecycle; init pre-creates this file
      # empty and the write-infra/write-browser stages populate it before any
      # consumer is created. keycloak-init fails closed on missing origins.
      - ${CI_RUNTIME_DIR:?CI runtime directory is required}/browser-endpoints.env
    environment:
      # Origins arrive via browser-endpoints.env under their manifest keys
      # (WEB_E2E_PUBLIC_BASE / ADMIN_E2E_PUBLIC_BASE); the reconcile scripts read
      # those directly under the CI runtime contract and fail closed when absent.
      CI_RUNTIME_CONTRACT: '1'
  redis:
    ports: !override ['127.0.0.1::6379']
  minio:
    ports: !override ['127.0.0.1::9000', '127.0.0.1::9001']
  redpanda:
    command: !override []
    entrypoint: ['/bin/sh', '/ci-entrypoint.sh']
    volumes:
      - ./infra/redpanda/ci-entrypoint.sh:/ci-entrypoint.sh:ro
      - ${CI_RUNTIME_DIR:?CI runtime directory is required}/redpanda-listener.env:/run/plexica-ci/redpanda-listener.env:ro
    ports: !override ['127.0.0.1::19092', '127.0.0.1::9644']
  mailpit:
    ports: !override ['127.0.0.1::1025', '127.0.0.1::8025']
  loki:
    ports: !override ['127.0.0.1::3100']
  grafana:
    ports: !override ['127.0.0.1::3000']
