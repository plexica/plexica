packages:
  - 'apps/*'
  - 'packages/*'
  - 'services/*'
  - 'examples/plugins/*'

# Centralized dependency versions (pnpm catalog). Workspaces reference these
# entries with "catalog:" instead of an inline range. Only dependencies shared
# by >= 2 workspaces belong here.
#
# Deliberately excluded:
#   - jose: pinned exactly (6.2.10) in @plexica/auth vs ^ range in core-api —
#     the auth pin is intentional; unifying would change one side's update policy.
#   - single-workspace deps (storybook stack, @fastify/*, prisma, ...):
#     a catalog entry adds no dedup value for them.
#   - zustand in @plexica/auth ("*"): intentionally version-agnostic there.
#
# @vitest/coverage-v8 sits in the catalog even though it is a dev-only
# dependency: its version is coupled to the workspace-wide vitest entry, so a
# coordinated bump stays atomic across the five workspaces that use it
# (core-api, sdk, vite-plugin, cli, auth — see ADR-030).
#
# Verified against pnpm-lock.yaml before unifying: zod, @originjs/vite-plugin-federation,
# fastify and vite already resolve to a single version across all importers, so
# adopting "catalog:" does not change any installed tree.
onlyBuiltDependencies:
  - '@confluentinc/kafka-javascript'
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma

# Security overrides — pinned to patched versions (Dependabot / pnpm audit)
# These override transitive dependencies. Kept here (not in package.json) because
# pnpm v10 ignores the `pnpm` field in package.json.
overrides:
  'brace-expansion@<2': 1.1.18
  'brace-expansion@>=4.0.0 <5.0.9': 5.0.9
  browserslist: 4.28.8
  'postcss-selector-parser': 6.1.3
  'decode-uri-component': 0.5.0
  lodash: ^4.18.1
  'js-yaml': ^4.3.1
  'fast-uri': 3.1.5
  'deepmerge-ts': ^8.0.0
  'nanoid@<3.3.18': 3.3.18
  'fast-xml-builder': 1.1.7
  'fast-xml-parser': 5.7.0
  '@babel/core': 7.29.6
  protobufjs: 7.6.5
  ws: 8.21.0
  'find-my-way@': 9.9.0

peerDependencyRules:
  ignoreMissing: []
  allowedVersions:
    'react-intl>react': '19'

catalog:
  '@fontsource/inter': ^5.3.0
  '@hookform/resolvers': ^5.9.1
  '@originjs/vite-plugin-federation': ^1.4.1
  '@playwright/test': ^1.62.0
  '@radix-ui/react-dropdown-menu': ^2.1.24
  '@tanstack/react-query': ^5.102.8
  '@tanstack/react-router': ^1.170.32
  '@types/node': ^24.0.0
  '@types/pg': ^8.23.1
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.5
  '@vitejs/plugin-react': ^4.3.0
  autoprefixer: ^10.5.4
  dotenv: ^17.4.2
  eslint-plugin-storybook: 10.5.10
  fastify: ^5.12.0
  lucide-react: ^1.37.0
  pg: ^8.23.0
  pino: ^9.0.0
  postcss: ^8.5.26
  react: ^19.2.8
  react-dom: ^19.2.8
  react-hook-form: ^7.86.0
  react-intl: ^6.6.0
  tailwindcss: ^3.4.0
  tsx: ^4.23.12
  typescript: ^5.9.0
  vite: ^6.4.3
  vitest: ^4.1.11
  '@vitest/coverage-v8': 4.1.11
  zod: ^3.25.76
  zustand: ^5.0.14

