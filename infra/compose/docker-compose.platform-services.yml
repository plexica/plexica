volumes:
  storage_data:

services:
  redis:
    image: redis:7.4.11-alpine@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7
    ports:
      - '${REDIS_PORT:-6379}:6379'
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  storage:
    image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z@sha256:b616a0cf8cb281e7e6bb3c9b1fb53875b4016a2878223925541c18f82d6c5ca3
    command: server /data --console-address ":9001"
    environment:
      # Server-consumed mapping targets only (FR-003 / E3): the container
      # reads MINIO_ROOT_USER/MINIO_ROOT_PASSWORD, but our interface stays the
      # neutral STORAGE_* host vars. Code/scripts/CI never read MINIO_ROOT_*.
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-storageadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-changeme}
    ports:
      - '${STORAGE_PORT:-9000}:9000'
      - '${STORAGE_CONSOLE_PORT:-9001}:9001'
    volumes:
      - storage_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.5@sha256:342d52b03d70e8c605897b1756d6faab14067af6f8a969264093dabbce1858dd
    command:
      - redpanda start
      - --smp 1
      - --memory 256M
      - --overprovisioned
      - --set redpanda.developer_mode=true
      - --kafka-addr PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
    ports:
      - '${REDPANDA_KAFKA_PORT:-19092}:19092'
      - '${REDPANDA_ADMIN_PORT:-9644}:9644'
    deploy:
      resources:
        limits:
          memory: 320M
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9644/v1/brokers | grep -q ''"node_id"''']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.5@sha256:342d52b03d70e8c605897b1756d6faab14067af6f8a969264093dabbce1858dd
    depends_on:
      redpanda:
        condition: service_healthy
    volumes:
      - ./infra/redpanda/ensure-topics.sh:/ensure-topics.sh:ro
    entrypoint: /bin/sh
    command: /ensure-topics.sh redpanda:9092
    restart: 'no'
    deploy:
      resources:
        limits:
          memory: 64M

  mailpit:
    image: axllent/mailpit:v1.31.1@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
    ports:
      - '${SMTP_PORT:-1025}:1025'
      - '${SMTP_UI_PORT:-8025}:8025'
    deploy:
      resources:
        limits:
          memory: 64M
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:8025 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
