# Postgres TLS for the CI runtime contract. Included by every lifecycle
# entrypoint ONLY when E2E_POSTGRES_TLS_SOURCE is set (admission-provided CA
# directory): container.env pins NODE_ENV=production + PLUGIN_DB_SSL_MODE=
# verify-full, so the contract postgres must serve TLS signed by a CA the
# runtime trusts. Trust is established exclusively by binding the PROJECT CA
# (staged inside the runner-owned runtime dir and onto the Docker host under
# /run/plexica-ci) into Core and every plugin sidecar — never by mutating the
# host system trust store (see provision-e2e-postgres-ca.sh).
volumes:
  postgres_ci_tls:

services:
  postgres-tls-init:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    user: root
    entrypoint: /bin/sh
    command: /generate-e2e-tls.sh
    volumes:
      - postgres_ci_tls:/tls
      - ${E2E_POSTGRES_TLS_SOURCE:?E2E_POSTGRES_TLS_SOURCE is required}:/source:ro
      - ./infra/postgres/generate-e2e-tls.sh:/generate-e2e-tls.sh:ro
    restart: 'no'

  # Sidecar containers are created through the HOST Docker daemon, so their
  # single allowed CA bind (CI_RUNTIME_CA_FILE=/run/plexica-ci/postgres-ca.crt)
  # resolves against HOST paths. This one-shot stages the project CA there via
  # a read-write /run mount — no sudo, no system trust store mutation, atomic
  # tmp+mv so concurrent projects on one runner never observe partial content.
  postgres-host-ca-init:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    user: root
    entrypoint: /bin/sh
    command: /stage-host-ca.sh
    volumes:
      - ${E2E_POSTGRES_TLS_SOURCE:?E2E_POSTGRES_TLS_SOURCE is required}:/source:ro
      - ./infra/postgres/stage-host-ca.sh:/stage-host-ca.sh:ro
      - /run:/host-run
    restart: 'no'

  postgres:
    depends_on:
      postgres-tls-init:
        condition: service_completed_successfully
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/tls/server.crt
      - -c
      - ssl_key_file=/tls/server.key
    volumes:
      - postgres_ci_tls:/tls:ro
