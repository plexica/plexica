# Postgres TLS for the CI runtime contract. Included by every lifecycle
# entrypoint ONLY when E2E_POSTGRES_TLS_SOURCE is set (admission-provided CA
# directory): container.env pins NODE_ENV=production + PLUGIN_DB_SSL_MODE=
# verify-full, so the contract postgres must serve TLS signed by a CA the
# runner trusts (plugin sidecars bind the runner system CA bundle and connect
# with sslmode=verify-full — parity with the canonical production E2E stack,
# see scripts/run-web-e2e-production.sh and
# infra/compose/docker-compose.e2e-production.yml).
volumes:
  postgres_ci_tls:

services:
  postgres-tls-init:
    image: postgres:15.17-alpine@sha256:fceb6f86328c36f2438fae3b851b0cc57c4a7e69a58c866d9ce24281f2cf0c9c
    user: root
    entrypoint: /bin/sh
    command: /generate-e2e-tls.sh
    volumes:
      - postgres_ci_tls:/tls
      - ${E2E_POSTGRES_TLS_SOURCE:?E2E_POSTGRES_TLS_SOURCE is required}:/source:ro
      - ./infra/postgres/generate-e2e-tls.sh:/generate-e2e-tls.sh:ro
    restart: 'no'

  postgres:
    depends_on:
      postgres-tls-init:
        condition: service_completed_successfully
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/tls/server.crt
      - -c
      - ssl_key_file=/tls/server.key
    volumes:
      - postgres_ci_tls:/tls:ro
