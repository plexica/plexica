# Compose services used only when docker-compose.ci.yml is supplied.
services:
  core-api-e2e:
    image: node:24-bookworm
    working_dir: /workspace
    command: pnpm --filter core-api start
    env_file: ${CI_RUNTIME_DIR:?CI runtime directory is required}/container.env
    environment:
      CI_RUNTIME_CONTRACT: '1'
      PORT: '3001'
      KEYCLOAK_PUBLIC_ISSUER_BASE: ${KEYCLOAK_PUBLIC_ISSUER_BASE:-}
      KEYCLOAK_CONTAINER_ADMIN_JWKS_BASE: http://keycloak:8080
      PLUGIN_CORE_API_URL: http://core-api-e2e:3001
    volumes:
      - .:/workspace:ro
    ports:
      - 127.0.0.1::3001
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  web-e2e:
    image: node:24-bookworm
    working_dir: /workspace
    command: pnpm --filter web preview --host 0.0.0.0
    environment:
      CI_RUNTIME_CONTRACT: '1'
      E2E_CORE_API_PROXY_TARGET: http://core-api-e2e:3001
    volumes:
      - .:/workspace:ro
      - ${CI_RUNTIME_DIR:?CI runtime directory is required}/runtime-config.js:/workspace/apps/web/public/runtime-config.js:ro
    ports:
      - 127.0.0.1::3000
    depends_on:
      core-api-e2e:
        condition: service_started

  admin-e2e:
    image: node:24-bookworm
    working_dir: /workspace
    command: pnpm --filter @plexica/admin preview --host 0.0.0.0
    environment:
      CI_RUNTIME_CONTRACT: '1'
      E2E_CORE_API_PROXY_TARGET: http://core-api-e2e:3001
    volumes:
      - .:/workspace:ro
      - ${CI_RUNTIME_DIR:?CI runtime directory is required}/runtime-config.js:/workspace/apps/admin/public/runtime-config.js:ro
    ports:
      - 127.0.0.1::3002
    depends_on:
      core-api-e2e:
        condition: service_started
