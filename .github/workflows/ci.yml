name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # CI-PORT-13 pre-flight: no Docker/no admission, runs every trigger.
  detect-ci-infra-changes:
    name: Detect CI-infrastructure changes
    runs-on: self-hosted
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.detect.outputs.heavy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect changed CI-infrastructure paths
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: bash .github/actions/docker-infra/scripts/detect-ci-infra-changes.sh

  # CI-PORT-13 (ADR-031, revised 2026-08-26): dispatch/detected-change/fail-open.
  ci-runtime-contract:
    name: Concurrent runtime contract
    needs: [detect-ci-infra-changes]
    if: always() && !cancelled() && (github.event_name == 'workflow_dispatch' || needs.detect-ci-infra-changes.result != 'success' || needs.detect-ci-infra-changes.outputs.heavy == 'true')
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-runner-admission
        with:
          purpose: contract
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup pnpm via Corepack
        run: corepack enable && corepack prepare pnpm@10.34.2 --activate
      - name: Generate run-scoped encryption material
        run: bash .github/actions/docker-infra/scripts/generate-ci-runtime-secrets.sh >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Build Compose runtime artifacts
        env:
          CI_RUNTIME_CONTRACT: '1'
          E2E_CORE_API_PROXY_TARGET: http://core-api-e2e:3001
          # Mirrors the canonical web suite production build (playwright.config
          # webCommand): the dev/E2E-only /test-error route is registered only
          # when VITE_E2E=true at build time.
          VITE_E2E: 'true'
        run: pnpm -r --filter='!@plexica/plugin-crm' --filter='!plexica' run build
      - run: bash .github/actions/docker-infra/scripts/verify-ci-runtime-artifacts.sh
      - name: Run isolated two-project full E2E contract
        env:
          CI: 'true'
          CI_RUNTIME_CONTRACT: '1'
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: bash .github/actions/docker-infra/scripts/verify-concurrent-ci-runtime.sh --full-e2e
      - name: Upload contract diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-runtime-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CI_RUNTIME_DIR }}/diagnostics/
            ${{ env.CI_RUNTIME_DIR }}/admission.env
          if-no-files-found: error
          retention-days: 7

  quality:
    name: Typecheck and frontend unit tests
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-runner-admission
        with:
          purpose: quality
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup pnpm via Corepack
        run: corepack enable && corepack prepare pnpm@10.34.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter web test
      - run: pnpm --filter @plexica/admin test
      - name: Upload quality admission evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-quality-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_RUNTIME_DIR }}/admission.env
          if-no-files-found: error
          retention-days: 7

  # Tolerates a SKIPPED contract (CI-PORT-13) but not a failed one.
  ci:
    name: Build, test, and validate
    needs: [ci-runtime-contract, quality]
    if: always() && !cancelled() && needs.quality.result == 'success' && (needs.ci-runtime-contract.result == 'success' || needs.ci-runtime-contract.result == 'skipped')
    runs-on: self-hosted
    # 120 (raised from 90, 2026-08-26): adds the single-project E2E fallback.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-runner-admission
        with:
          purpose: build
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup pnpm via Corepack
        run: corepack enable && corepack prepare pnpm@10.34.2 --activate
      - name: Generate run-scoped encryption material
        run: bash .github/actions/docker-infra/scripts/generate-ci-runtime-secrets.sh --full >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:line-gate && pnpm check:lines
      - run: pnpm --filter @plexica/keycloak-theme build
      - run: pnpm lint
      - name: Build CI runtime artifacts
        env:
          CI_RUNTIME_CONTRACT: '1'
          E2E_CORE_API_PROXY_TARGET: http://core-api-e2e:3001
          VITE_E2E: 'true'
        run: pnpm -r --filter='!@plexica/plugin-crm' --filter='!plexica' run build
      - name: Test CI runtime contracts
        run: bash .github/actions/docker-infra/scripts/run-ci-contract-tests.sh
      - name: Start independent project runtime
        uses: ./.github/actions/docker-infra
        with:
          project: ${{ env.CI_COMPOSE_PROJECT }}
          runtime-dir: ${{ env.CI_RUNTIME_DIR }}
          postgres-password: ${{ env.POSTGRES_PASSWORD }}
          minio-access-key: ${{ env.MINIO_ACCESS_KEY }}
          minio-secret-key: ${{ env.MINIO_SECRET_KEY }}
          phase: full
      - name: Migrate through the host manifest
        run: test -f "$CI_RUNTIME_DIR/host.env"
      - name: Prove real CI sidecar lifecycle through Core and Docker proxy
        run: bash .github/actions/docker-infra/scripts/verify-ci-sidecar-lifecycle.sh
      - name: Run core-api tests through the host manifest
        # Host-side Vitest runs against the project runtime: the manifest is
        # the single source of truth for infra endpoints and credentials.
        # LOKI_URL/SMTP_* are derived aliases of manifest entries (check-test-env
        # contract) and are never written to host.env themselves.
        run: |
          source .github/actions/docker-infra/scripts/source-ci-runtime-host.sh
          mailpit_address=${MAILPIT_SMTP_URL#smtp://}
          export LOKI_URL="$LOKI_HOST_URL" \
            SMTP_HOST="${mailpit_address%:*}" SMTP_PORT="${mailpit_address##*:}"
          pnpm --filter core-api test
      - name: Run single-project browser E2E suite (web + admin)
        # CI-PORT-13 fallback: only when ci-runtime-contract was skipped for
        # this trigger; same suites, single project, unconditional Rule 1 E2E.
        if: needs.ci-runtime-contract.result == 'skipped'
        run: bash .github/actions/docker-infra/scripts/run-single-project-e2e-suite.sh
      - name: Collect scoped diagnostics
        if: always()
        uses: ./.github/actions/docker-infra
        with:
          project: ${{ env.CI_COMPOSE_PROJECT }}
          runtime-dir: ${{ env.CI_RUNTIME_DIR }}
          postgres-password: ${{ env.POSTGRES_PASSWORD }}
          minio-access-key: ${{ env.MINIO_ACCESS_KEY }}
          minio-secret-key: ${{ env.MINIO_SECRET_KEY }}
          phase: diagnostics
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CI_RUNTIME_DIR }}/diagnostics/
            ${{ env.CI_RUNTIME_DIR }}/admission.env
          if-no-files-found: error
          retention-days: 7
      - name: Remove scoped project runtime
        if: always()
        uses: ./.github/actions/docker-infra
        with:
          project: ${{ env.CI_COMPOSE_PROJECT }}
          runtime-dir: ${{ env.CI_RUNTIME_DIR }}
          postgres-password: ${{ env.POSTGRES_PASSWORD }}
          minio-access-key: ${{ env.MINIO_ACCESS_KEY }}
          minio-secret-key: ${{ env.MINIO_SECRET_KEY }}
          phase: down
