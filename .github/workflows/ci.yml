name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci-runtime-contract:
    name: Concurrent runtime contract
    runs-on: [self-hosted, plexica-ci-concurrent-e2e]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Initialize and admit this runner
        shell: bash
        run: |
          project="plexica-ci-contract-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          runtime="$(RUNNER_TEMP="$RUNNER_TEMP" bash .github/actions/docker-infra/scripts/ci-runtime-env.sh init "$project")"
          printf 'CI_COMPOSE_PROJECT=%s\nCI_RUNTIME_DIR=%s\n' "$project" "$runtime" >> "$GITHUB_ENV"
          CI_RUNTIME_DIR="$runtime" bash .github/actions/docker-infra/scripts/verify-ci-runner-capacity.sh "$project"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false
      - name: Generate run-scoped encryption material
        shell: bash
        run: |
          key() { openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n'; }
          printf 'EVENT_KEY_ENCRYPTION_KEY=%s\nPLUGIN_DB_ENCRYPTION_KEY=%s\nPLUGIN_CREDENTIAL_PEPPER=%s\n' "$(key)" "$(openssl rand -hex 32)" "$(key)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @plexica/keycloak-theme build
      - name: Run isolated two-project full E2E contract
        env:
          CI: 'true'
          CI_RUNTIME_CONTRACT: '1'
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: bash .github/actions/docker-infra/scripts/verify-concurrent-ci-runtime.sh --full-e2e
      - name: Upload contract diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-runtime-contract-${{ github.run_id }}
          path: ${{ env.CI_RUNTIME_DIR }}/diagnostics/
          if-no-files-found: error
          retention-days: 7

  ci:
    name: Build, test, and validate
    needs: ci-runtime-contract
    runs-on: [self-hosted, plexica-ci-concurrent-e2e]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Initialize and admit this runner
        shell: bash
        run: |
          project="plexica-ci-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          runtime="$(RUNNER_TEMP="$RUNNER_TEMP" bash .github/actions/docker-infra/scripts/ci-runtime-env.sh init "$project")"
          printf 'CI_COMPOSE_PROJECT=%s\nCI_RUNTIME_DIR=%s\n' "$project" "$runtime" >> "$GITHUB_ENV"
          CI_RUNTIME_DIR="$runtime" bash .github/actions/docker-infra/scripts/verify-ci-runner-capacity.sh "$project"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false
      - name: Generate run-scoped encryption material
        shell: bash
        run: |
          key() { openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n'; }
          printf 'EVENT_KEY_ENCRYPTION_KEY=%s\nPLUGIN_DB_ENCRYPTION_KEY=%s\nPLUGIN_CREDENTIAL_PEPPER=%s\n' "$(key)" "$(openssl rand -hex 32)" "$(key)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:line-gate && pnpm check:lines
      - run: pnpm --filter @plexica/keycloak-theme build
      - run: pnpm lint
      - run: pnpm -r --filter='!@plexica/plugin-crm' --filter='!plexica' run build
      - name: Start independent project runtime
        uses: ./.github/actions/docker-infra
        with:
          project: ${{ env.CI_COMPOSE_PROJECT }}
          runtime-dir: ${{ env.CI_RUNTIME_DIR }}
          phase: full
      - name: Migrate through the host manifest
        run: test -f "$CI_RUNTIME_DIR/host.env"
      - run: pnpm --filter core-api test
      - name: Run Compose-backed browser E2E
        env:
          CI: 'true'
          CI_RUNTIME_CONTRACT: '1'
          PLAYWRIGHT_E2E: 'true'
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: |
          pnpm --filter web exec playwright test
          pnpm --filter @plexica/admin exec playwright test
      - name: Collect scoped diagnostics
        if: always()
        uses: ./.github/actions/docker-infra
        with:
          project: ${{ env.CI_COMPOSE_PROJECT }}
          runtime-dir: ${{ env.CI_RUNTIME_DIR }}
          phase: diagnostics
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-runtime-${{ github.run_id }}
          path: ${{ env.CI_RUNTIME_DIR }}/diagnostics/
          if-no-files-found: error
          retention-days: 7
      - name: Remove scoped project runtime
        if: always()
        uses: ./.github/actions/docker-infra
        with:
          project: ${{ env.CI_COMPOSE_PROJECT }}
          runtime-dir: ${{ env.CI_RUNTIME_DIR }}
          phase: down
