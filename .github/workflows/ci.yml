name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci-runtime-contract:
    name: Concurrent runtime contract
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-runner-admission
        with:
          purpose: contract
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false
      - name: Generate run-scoped encryption material
        shell: bash
        run: |
          key() { openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n'; }
          printf 'EVENT_KEY_ENCRYPTION_KEY=%s\nPLUGIN_DB_ENCRYPTION_KEY=%s\nPLUGIN_CREDENTIAL_PEPPER=%s\n' "$(key)" "$(openssl rand -hex 32)" "$(key)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Build Compose runtime artifacts
        env:
          CI_RUNTIME_CONTRACT: '1'
          E2E_CORE_API_PROXY_TARGET: http://core-api-e2e:3001
        run: pnpm -r --filter='!@plexica/plugin-crm' --filter='!plexica' run build
      - run: bash .github/actions/docker-infra/scripts/verify-ci-runtime-artifacts.sh
      - name: Run isolated two-project full E2E contract
        env:
          CI: 'true'
          CI_RUNTIME_CONTRACT: '1'
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: bash .github/actions/docker-infra/scripts/verify-concurrent-ci-runtime.sh --full-e2e
      - name: Upload contract diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-runtime-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CI_RUNTIME_DIR }}/diagnostics/
            ${{ env.CI_RUNTIME_DIR }}/admission.env
          if-no-files-found: error
          retention-days: 7

  quality:
    name: Typecheck and frontend unit tests
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-runner-admission
        with:
          purpose: quality
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter web test
      - run: pnpm --filter @plexica/admin test
      - name: Upload quality admission evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-quality-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_RUNTIME_DIR }}/admission.env
          if-no-files-found: error
          retention-days: 7

  ci:
    name: Build, test, and validate
    needs: [ci-runtime-contract, quality]
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-runner-admission
        with:
          purpose: build
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false
      - name: Generate run-scoped encryption material
        shell: bash
        run: |
          key() { openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n'; }
          printf 'EVENT_KEY_ENCRYPTION_KEY=%s\nPLUGIN_DB_ENCRYPTION_KEY=%s\nPLUGIN_CREDENTIAL_PEPPER=%s\nPOSTGRES_PASSWORD=%s\n' "$(key)" "$(openssl rand -hex 32)" "$(key)" "$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:line-gate && pnpm check:lines
      - run: pnpm --filter @plexica/keycloak-theme build
      - run: pnpm lint
      - name: Build CI runtime artifacts
        env:
          CI_RUNTIME_CONTRACT: '1'
          E2E_CORE_API_PROXY_TARGET: http://core-api-e2e:3001
        run: pnpm -r --filter='!@plexica/plugin-crm' --filter='!plexica' run build
      - name: Test CI runtime contracts
        run: |
          node .github/actions/docker-infra/scripts/ci-runtime-endpoint-contract.test.mjs
          node .github/actions/docker-infra/scripts/sanitize-ci-runtime-diagnostics.test.mjs
          bash .github/actions/docker-infra/scripts/ci-runtime-env.test.sh
          bash .github/actions/docker-infra/scripts/ci-runtime-keycloak-credentials.test.sh
          bash .github/actions/docker-infra/scripts/ci-runtime-compose.test.sh
          bash .github/actions/docker-infra/scripts/ci-runtime-cleanup.test.sh
          bash .github/actions/docker-infra/scripts/ensure-topics.test.sh
          bash .github/actions/docker-infra/scripts/keycloak-contract.test.sh
          bash .github/actions/docker-infra/scripts/redpanda-contract.test.sh
          bash .github/actions/docker-infra/scripts/verify-ci-runtime-artifacts.test.sh
          bash .github/actions/docker-infra/scripts/verify-ci-runner-capacity.test.sh
          node .github/actions/docker-infra/scripts/ci-workflow-contract.test.mjs
          bash .github/actions/docker-infra/scripts/ci-runtime-lifecycle.test.sh
          bash .github/actions/docker-infra/scripts/verify-ci-sidecar-lifecycle.test.sh
          bash .github/actions/docker-infra/scripts/verify-ci-compose-render.test.sh
          bash .github/actions/docker-infra/scripts/wait-services.test.sh
          bash .github/actions/docker-infra/scripts/wait-for-http.test.sh
          bash .github/actions/docker-infra/scripts/down-ci-runtime-project.test.sh
          bash .github/actions/docker-infra/scripts/verify-concurrent-ci-runtime.test.sh
          node infra/docker/ci-plugin-docker-proxy.test.mjs
      - name: Start independent project runtime
        uses: ./.github/actions/docker-infra
        with:
          project: ${{ env.CI_COMPOSE_PROJECT }}
          runtime-dir: ${{ env.CI_RUNTIME_DIR }}
          postgres-password: ${{ env.POSTGRES_PASSWORD }}
          phase: full
      - name: Migrate through the host manifest
        run: test -f "$CI_RUNTIME_DIR/host.env"
      - name: Prove real CI sidecar lifecycle through Core and Docker proxy
        run: bash .github/actions/docker-infra/scripts/verify-ci-sidecar-lifecycle.sh
      - run: pnpm --filter core-api test
      - name: Collect scoped diagnostics
        if: always()
        uses: ./.github/actions/docker-infra
        with:
          project: ${{ env.CI_COMPOSE_PROJECT }}
          runtime-dir: ${{ env.CI_RUNTIME_DIR }}
          postgres-password: ${{ env.POSTGRES_PASSWORD }}
          phase: diagnostics
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CI_RUNTIME_DIR }}/diagnostics/
            ${{ env.CI_RUNTIME_DIR }}/admission.env
          if-no-files-found: error
          retention-days: 7
      - name: Remove scoped project runtime
        if: always()
        uses: ./.github/actions/docker-infra
        with:
          project: ${{ env.CI_COMPOSE_PROJECT }}
          runtime-dir: ${{ env.CI_RUNTIME_DIR }}
          postgres-password: ${{ env.POSTGRES_PASSWORD }}
          phase: down
