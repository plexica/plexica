name: CI runtime infrastructure
description: Creates and verifies a project-scoped dynamic-port CI Compose runtime.
inputs:
  project:
    description: Validated per-run Compose project ID
    required: true
  runtime-dir:
    description: Private per-run runtime directory
    required: true
  phase:
    description: admission, start, wait, full (admission + start + wait), diagnostics, or down
    default: full
  postgres-db:
    default: plexica
  postgres-user:
    default: plexica
  postgres-password:
    description: Per-run generated PostgreSQL superuser password
    required: true
runs:
  using: composite
  steps:
    - name: Admit concurrent E2E runner
      # `full` must gate on runner admission too: a caller omitting `phase`
      # otherwise starts+waits the runtime without the capacity contract.
      if: inputs.phase == 'admission' || inputs.phase == 'full'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CI_COMPOSE_PROJECT: ${{ inputs.project }}
        CI_RUNTIME_DIR: ${{ inputs.runtime-dir }}
      run: bash "$ACTION_PATH/scripts/verify-ci-runner-capacity.sh" "$CI_COMPOSE_PROJECT"
    - name: Start project runtime
      if: inputs.phase == 'start' || inputs.phase == 'full'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CI_COMPOSE_PROJECT: ${{ inputs.project }}
        CI_RUNTIME_DIR: ${{ inputs.runtime-dir }}
        POSTGRES_DB: ${{ inputs.postgres-db }}
        POSTGRES_USER: ${{ inputs.postgres-user }}
        POSTGRES_PASSWORD: ${{ inputs.postgres-password }}
      run: bash "$ACTION_PATH/scripts/start-services.sh"
    - name: Wait for project runtime
      if: inputs.phase == 'wait' || inputs.phase == 'full'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CI_COMPOSE_PROJECT: ${{ inputs.project }}
        CI_RUNTIME_DIR: ${{ inputs.runtime-dir }}
        POSTGRES_DB: ${{ inputs.postgres-db }}
        POSTGRES_USER: ${{ inputs.postgres-user }}
        POSTGRES_PASSWORD: ${{ inputs.postgres-password }}
      run: bash "$ACTION_PATH/scripts/wait-services.sh"
    - name: Capture scoped diagnostics
      if: always() && inputs.phase == 'diagnostics'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CI_COMPOSE_PROJECT: ${{ inputs.project }}
        CI_RUNTIME_DIR: ${{ inputs.runtime-dir }}
      run: bash "$ACTION_PATH/scripts/collect-ci-runtime-diagnostics.sh"
    - name: Remove project runtime
      if: always() && inputs.phase == 'down'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CI_COMPOSE_PROJECT: ${{ inputs.project }}
        CI_RUNTIME_DIR: ${{ inputs.runtime-dir }}
      run: bash "$ACTION_PATH/scripts/down-ci-runtime-project.sh"
