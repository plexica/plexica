name: CI runner admission
description: Initializes a private runtime directory and admits the runner before capacity-consuming work.
inputs:
  purpose:
    description: Short project purpose suffix
    required: true
runs:
  using: composite
  steps:
    - name: Initialize and admit this runner
      shell: bash
      env:
        # Indirection via env keeps the untrusted input out of the bash
        # command text; the allowlist below rejects unexpected purposes.
        PURPOSE: ${{ inputs.purpose }}
      run: |
        case "$PURPOSE" in
          contract|quality|build) ;;
          *) echo "Unsupported admission purpose: $PURPOSE" >&2; exit 1 ;;
        esac
        project="plexica-ci-${PURPOSE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        runtime="$(RUNNER_TEMP="$RUNNER_TEMP" bash "${{ github.action_path }}/../docker-infra/scripts/ci-runtime-env.sh" init "$project")"
        printf 'CI_COMPOSE_PROJECT=%s\nCI_RUNTIME_DIR=%s\n' "$project" "$runtime" >> "$GITHUB_ENV"
        CI_RUNTIME_DIR="$runtime" RUNNER_TEMP="$RUNNER_TEMP" bash "${{ github.action_path }}/../docker-infra/scripts/verify-ci-runner-capacity.sh" "$project"
        # Stable E2E postgres CA: generated once per runner, staged inside the
        # runner-owned runtime tree and exported as host-process trust env
        # (NODE_EXTRA_CA_CERTS for Node, SSL_CERT_FILE for OpenSSL-based tools)
        # for every runtime lifecycle in this job. System-store install is
        # best-effort only: GitHub-hosted runners have no root access.
        ca_dir="$RUNNER_TEMP/plexica-ci/e2e-postgres-ca"
        exports="$(bash "${{ github.action_path }}/../docker-infra/scripts/provision-e2e-postgres-ca.sh" "$ca_dir")"
        eval "$exports"
        printf 'E2E_POSTGRES_TLS_SOURCE=%s\nNODE_EXTRA_CA_CERTS=%s\nSSL_CERT_FILE=%s\n' \
          "$E2E_POSTGRES_TLS_SOURCE" "$NODE_EXTRA_CA_CERTS" "$SSL_CERT_FILE" >> "$GITHUB_ENV"
